name: release

# Push a tag like v1.0.0 to build CursorMotionBlur.exe and attach it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorMotionBlur
          path: dist/CursorMotionBlur.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CursorMotionBlur.exe
          generate_release_notes: true
